services:
  # --------------------------------------------------------------------------
  # Redis (local) — session cache / queue
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: chatbot-law-redis
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------------
  # AI Service — PostgreSQL Supabase cloud (checkpoint), Neo4j AuraDB cloud
  # --------------------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: chatbot-law-ai-service
    restart: unless-stopped
    mem_limit: 3g
    env_file:
      - ./.env
    environment:
      FASTAPI_URI: 0.0.0.0
      FASTAPI_PORT: 8001
      REDIS_URL: "redis://redis:6379"
      # DATABASE_URL, NEO4J_* → từ .env (cloud)
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Backend Core — PostgreSQL Supabase cloud (DATABASE_URL từ .env)
  # --------------------------------------------------------------------------
  backend-core:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    container_name: chatbot-law-backend-core
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: "redis://redis:6379"
      FASTAPI_URL: ai-service
      FASTAPI_PORT: 8001
      LEXMIND_AI_SERVICE_URL: http://ai-service:8001
      # DATABASE_URL → từ .env (Supabase Pooler)
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy

volumes:
  redis_data:
