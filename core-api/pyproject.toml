[project]
name = "chatbot-law-core-api"
version = "0.1.0"
description = "Primary FastAPI backend for Chatbot Law."
requires-python = ">=3.11"
dependencies = [
  "aiosmtplib>=3.0,<4",
  "alembic>=1.14,<2",
  "arq>=0.26,<1",
  "asyncpg>=0.30,<1",
  "authlib>=1.3,<2",
  "bcrypt>=4.2,<5",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
