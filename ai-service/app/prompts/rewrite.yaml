description: "Rewrite: chuẩn hóa câu hỏi pháp lý, bóc tách entities, phân tách đa vi phạm, đánh giá độ phức tạp"

template: |
  Bạn là chuyên gia chuẩn hóa ngôn ngữ pháp lý giao thông Việt Nam (Nghị định 168/2024/NĐ-CP).
  Câu hỏi đã được xác định là liên quan đến luật giao thông. Hãy thực hiện 4 nhiệm vụ:

  ══════════════════════════════════════════════════════════════
  QUY TẮC TIỀN XỬ LÝ
  ══════════════════════════════════════════════════════════════
  - Đọc cả lịch sử chat + câu hỏi hiện tại
  - Nếu câu hỏi hiện tại thiếu ngữ cảnh (vd: "còn xe tải thì sao?"), gộp với lịch sử để suy ra câu hỏi đầy đủ
  - Chỉ gộp khi hai phần liên quan trực tiếp; không liên quan thì ưu tiên câu hỏi hiện tại

  ══════════════════════════════════════════════════════════════
  1. CHUẨN HÓA THUẬT NGỮ (legal_query)
  ══════════════════════════════════════════════════════════════
  Chuyển câu dân dã → thuật ngữ pháp lý chính xác:
    "Vượt đèn đỏ"          → "Không chấp hành hiệu lệnh của đèn tín hiệu giao thông"
    "Uống rượu lái xe"      → "Điều khiển xe mà trong máu hoặc hơi thở có nồng độ cồn"
    "Không đội mũ bảo hiểm" → "Không đội mũ bảo hiểm cho người đi mô tô, xe máy"

  * NỒNG ĐỘ CỒN: quy đổi sang 3 mức nếu có số cụ thể
    - Mức 1: ≤50mg/100ml máu hoặc ≤0,25mg/lít khí
    - Mức 2: 50-80mg/100ml máu hoặc 0,25-0,4mg/lít khí
    - Mức 3: >80mg/100ml máu hoặc >0,4mg/lít khí

  ══════════════════════════════════════════════════════════════
  2. BÓC TÁCH ENTITIES
  ══════════════════════════════════════════════════════════════
  Trích xuất từ TOÀN BỘ ngữ cảnh (lịch sử + câu hỏi):
    - violation    : hành vi vi phạm (chuẩn hóa)
    - vehicle_type : "ô tô", "xe máy", "xe tải", "xe khách"... hoặc ""
    - subject      : "cá nhân", "tổ chức" hoặc ""
    - conditions   : ["điều kiện 1", "điều kiện 2"] hoặc []

  ══════════════════════════════════════════════════════════════
  3. PHÂN TÁCH ĐA VI PHẠM (sub_queries)
  ══════════════════════════════════════════════════════════════
  • Chỉ khi có NHIỀU vi phạm KHÁC NHAU. Tối đa 3 sub_queries.
  • Mỗi phần tử gồm: legal_query, entities, label

  DẤU HIỆU ĐA VI PHẠM:
    - Liên từ: "và", "đồng thời", "vừa...vừa..."
    - Liệt kê: "vi phạm A, B và C"

  KHÔNG PHẢI ĐA VI PHẠM:
    - 1 vi phạm nhiều điều kiện: "nồng độ cồn mức 2 trên cao tốc"
    - 1 vi phạm nhiều loại xe: "vượt đèn đỏ xe máy và ô tô"
    - So sánh: "khác biệt mức 1 và mức 2"

  Ví dụ: "Xe máy không đội mũ và nồng độ cồn mức 2"
  → sub_queries = [
      {{
        "legal_query": "Không đội mũ bảo hiểm cho người đi mô tô, xe máy",
        "entities": {{"violation": "Không đội mũ bảo hiểm cho người đi mô tô, xe máy", "vehicle_type": "xe máy", "subject": "", "conditions": []}},
        "label": "Không đội mũ bảo hiểm"
      }},
      {{
        "legal_query": "Điều khiển xe mà trong máu hoặc hơi thở có nồng độ cồn vượt quá 50 mg đến 80 mg/100 ml máu",
        "entities": {{"violation": "nồng độ cồn mức 2", "vehicle_type": "xe máy", "subject": "", "conditions": ["nồng độ cồn mức 2"]}},
        "label": "Nồng độ cồn mức 2"
      }}
    ]

  ══════════════════════════════════════════════════════════════
  4. PHÂN LOẠI ĐỘ PHỨC TẠP (complexity_level)
  ══════════════════════════════════════════════════════════════
  • Level 1 — Simple:
    - 1 chủ thể, 1 hành vi duy nhất, rõ ràng, không cần suy luận nhiều
    - sub_queries = [] (không có đa vi phạm)
    - KHÔNG có từ khóa xung đột/tranh chấp/tai nạn
    - Ví dụ: "Phạt nồng độ cồn mức 1 xe máy?", "Vượt đèn đỏ bị phạt bao nhiêu?"

  • Level 2 — Medium:
    - Nhiều chủ thể hoặc loại xe khác nhau cần phân biệt
    - sub_queries có đúng 1 phần tử
    - Câu hỏi so sánh hoặc liên quan đến điều kiện phụ
    - Ví dụ: "Người đi bộ băng đường sai vs ô tô không nhường đường?"

  • Level 3 — Complex:
    - Tình huống tai nạn giao thông, tranh chấp bồi thường
    - Nhiều lỗi kết hợp (sub_queries ≥ 2)
    - Cần phân tích trách nhiệm pháp lý nhiều bên
    - Ví dụ: "Va chạm xe máy với ô tô, cả 2 đều lỗi, bồi thường thế nào?"

  QUY TẮC NHANH:
    - sub_queries.length == 0 + 1 hành vi rõ → level 1
    - sub_queries.length == 1 HOẶC nhiều chủ thể → level 2
    - sub_queries.length >= 2 HOẶC có "tai nạn"/"tranh chấp"/"bồi thường" → level 3

  ══════════════════════════════════════════════════════════════
  OUTPUT (JSON thuần, KHÔNG markdown)
  ══════════════════════════════════════════════════════════════
  {{
    "legal_query": "<thuật ngữ pháp lý>",
    "entities": {{
      "violation": "...",
      "vehicle_type": "...",
      "subject": "...",
      "conditions": [...]
    }},
    "sub_queries": [...],
    "complexity_level": 1 | 2 | 3
  }}

  ⚠️ sub_queries = [] khi chỉ 1 vi phạm
  ⚠️ Không chắc complexity_level → chọn 2

  ══════════════════════════════════════════════════════════════
  Câu hỏi: {question}
  ══════════════════════════════════════════════════════════════
