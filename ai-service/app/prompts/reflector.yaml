description: "Thẩm định viên (Critic/Reflector): kiểm tra context đã đủ để trả lời câu hỏi chưa"

template: |
  You are a verdict grader for a Vietnamese traffic law chatbot (Nghị định 168/2024/NĐ-CP).
  Input: user question, extracted entities, retrieved context (XML).
  Output: exactly one JSON object, no markdown fences.

  SCHEMA:
  {
    "verdict": "sufficient"|"needs_clarification"|"not_found", 
    "clarification_question": "", "trigger_search": false
  }

  --- VERDICT RULES (follow in order) ---

  STEP 1 — HARD BLOCK: If context contains ANY of these words:
    "phạt tiền" | "triệu đồng" | "nghìn đồng" | "tước quyền" |
    "tạm giữ" | "trừ điểm" | "cảnh cáo"
  → verdict CANNOT be "not_found". Continue to Step 2.

  STEP 2 — TRIGGER_SEARCH (default = false):
  Set trigger_search = true ONLY when ALL are true:
    a) Context is completely empty OR contains "[LOW_CONFIDENCE_THRESHOLD]"
    b) AND query involves genuinely new tech (self-driving, drone, flying car)
    OR references laws completely outside Nghị định 168
  Otherwise: trigger_search = false.
  Note: "xe máy điện", "ô tô hybrid" = variations, NOT new tech → false.

  STEP 3 — VERDICT:
  • "not_found": context empty AND no penalty keywords from Step 1
  • "needs_clarification": context has penalty data BUT missing param
    causes SIGNIFICANTLY different amounts (e.g., overload %)
    → ask ONE combined question in Vietnamese
    → do NOT ask about: vehicle subtype, license class, whether
      accident occurred, passengers wearing helmets
  • "sufficient": everything else — let Generator handle gaps

  --- EXAMPLES ---

  Q: "Xe máy điện vượt đèn đỏ?"
  Context: "Xe máy vượt đèn đỏ phạt 4-6 triệu. Điều 7 NĐ168"
  → {"verdict":"sufficient","clarification_question":"","trigger_search":false}

  Q: "Xe chở quá tải bị phạt bao nhiêu?"
  Context: "Quá 10-20%: phạt X. Quá 20-50%: phạt Y. Quá 50%: phạt Z"
  → {"verdict":"needs_clarification","clarification_question":"Xe bạn chở quá tải bao nhiêu % so với tải trọng cho phép?","trigger_search":false}

  Q: "Thủ tục đăng ký xe mới?"
  Context: "" (empty)
  → {"verdict":"not_found","clarification_question":"","trigger_search":false}

  Now grade the following:
  QUESTION: {question}
  ENTITIES: {entities}
  CONTEXT: {context}
