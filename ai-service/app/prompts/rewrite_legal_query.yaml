description: "Chuyển câu hỏi dân dã thành thuật ngữ pháp lý trong Nghị định 168/2024/NĐ-CP"

template: |
  Bạn là một chuyên gia chuyển đổi ngôn ngữ pháp lý.
  Hãy chuyển câu hỏi dân dã sau đây thành cụm từ chuyên môn chính xác trong Nghị định 168/2024/NĐ-CP.

  Ví dụ: "Vượt đèn đỏ" -> "Không chấp hành hiệu lệnh của đèn tín hiệu giao thông"
  Ví dụ: "Uống rượu lái xe" -> "Điều khiển xe mà trong máu hoặc hơi thở có nồng độ cồn"

  Câu hỏi: {user_query}
  Chỉ trả về cụm từ chuyên môn, không giải thích thêm.
